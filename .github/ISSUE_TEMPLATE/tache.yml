name: Tâche
description: Développement chiffré
labels: ["feature"]
type: Task
body:
  - type: input
    id: reference
    attributes:
      label: Référence d'origine
      description: Ticket GLPI, tâche Odoo ou client à l'origine de la demande. Vide si la demande est interne (l'issue sert alors de référence).
      placeholder: glpi-1234, odoo-2099 ou client
    validations:
      required: false

  - type: dropdown
    id: taille
    attributes:
      label: Taille
      description: Temps total estimé du ticket, échanges et recette compris. XXL est à découper.
      options:
        - XS (moins d'1 h)
        - S (1 à 3 h)
        - M (une demi-journée à une journée)
        - L (1 à 3 jours)
        - XL (3 à 5 jours)
        - XXL (plus de 5 jours)
    validations:
      required: true

  - type: textarea
    id: objectif
    attributes:
      label: Objectif
      description: Une à trois phrases. Le quoi, pas le comment.
    validations:
      required: true

  - type: textarea
    id: criteres
    attributes:
      label: Critères de fin
      value: |
        - [ ]
        - [ ]
    validations:
      required: true

  - type: textarea
    id: notes
    attributes:
      label: Notes techniques
      description: Fichiers concernés, dépendances, points d'attention.
    validations:
      required: false

  - type: textarea
    id: cloture
    attributes:
      label: Écart à la clôture
      description: À compléter en fermant l'issue. Temps réel, et ce qui a surpris.
    validations:
      required: false
