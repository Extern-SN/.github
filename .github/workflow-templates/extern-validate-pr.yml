name: Validate PR

# Pose le label de version déduit de la branche, puis vérifie le nommage
# (feature/*, fix/*, hotfix/* vers dev) et la présence d'un seul label.

on:
  pull_request:
    branches: [dev, main]
    types: [opened, reopened, edited, synchronize, labeled, unlabeled]

permissions:
  contents: read

jobs:
  validate:
    permissions:
      contents: read
      pull-requests: write
    uses: Extern-SN/github-workflows/.github/workflows/validate-pr-labelled.yml@v1
